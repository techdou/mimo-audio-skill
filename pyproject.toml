[project]
name = "mimo-audio-skill"
version = "2.4.0"
description = "General-purpose MiMo TTS narration skill: lecture, novel, podcast and short-video audio with reusable voice/style profiles, ASR QA, subtitles, HTML review, WAV merge, and packaging."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "MiMo Audio Skill Maintainers" }]
keywords = ["mimo", "tts", "asr", "narration", "voice-clone", "voice-design", "profile", "audio", "skill"]

[project.optional-dependencies]
docx = ["python-docx>=1.1.0"]
dev = ["jsonschema>=4.0.0"]

[tool.setuptools]
py-modules = []

[tool.mimo_audio_skill]
entrypoint = "SKILL.md"
script_dir = "scripts"
